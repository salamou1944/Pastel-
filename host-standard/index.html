<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host Standard</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
  }
}
</script>
<script src="./config.js"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8f2eb;background:var(--bg,#100c0a);--accent:#e8c99f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 8%,rgba(232,201,159,.22),transparent 26%),radial-gradient(circle at 18% 82%,rgba(124,88,62,.18),transparent 30%),linear-gradient(135deg,#090807 0%,#15100d 48%,#0b0908 100%)}
.shell{width:min(1180px,100%);min-height:100vh;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;align-items:stretch}
.host-card,.chat{border:1px solid rgba(255,255,255,.10);border-radius:30px;background:linear-gradient(145deg,rgba(30,22,18,.88),rgba(12,10,9,.82));box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;backdrop-filter:blur(18px)}
.host-card{min-height:calc(100vh - 32px);position:relative}
#avatar{width:100%;height:100%;min-height:620px;background:radial-gradient(ellipse at 50% 34%,rgba(232,201,159,.20),transparent 30%),radial-gradient(ellipse at 50% 80%,rgba(255,255,255,.05),transparent 42%)}
.fallback{width:100%;height:100%;min-height:620px;border:0;background:transparent;display:none}
.badge{position:absolute;top:18px;right:18px;z-index:5;padding:9px 13px;border-radius:999px;background:rgba(10,8,7,.72);border:1px solid rgba(232,201,159,.24);font-size:11px;letter-spacing:.08em;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.status{position:absolute;bottom:18px;right:18px;left:18px;z-index:5;padding:10px 14px;border-radius:999px;background:#0b0908dd;border:1px solid #ffffff12;font-size:13px}
.status.ok{opacity:0;pointer-events:none}.status.error{background:#421f1bdd}
.chat{padding:30px;align-self:center;position:relative}.chat:before{content:"";position:absolute;top:0;right:12%;width:76%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.55}.eyebrow{color:var(--accent);letter-spacing:.12em;font-size:12px;font-weight:800;white-space:pre-line}
h1{font-size:clamp(32px,5vw,58px);line-height:1.05;margin:12px 0;white-space:pre-line}p{color:#cfc4bb;line-height:1.75}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
button{font:inherit;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);color:#fff;border-radius:15px;padding:13px 12px;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}button:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);border-color:rgba(232,201,159,.25);box-shadow:0 8px 22px rgba(0,0,0,.16)}
.primary{background:linear-gradient(135deg,#f0d7b0,#d8b783);color:#18110d;border:0;font-weight:850;box-shadow:0 10px 28px rgba(232,201,159,.18)}
.answer{min-height:110px;border-radius:18px;background:linear-gradient(145deg,rgba(8,7,6,.82),rgba(23,17,14,.72));border:1px solid rgba(255,255,255,.07);padding:17px;line-height:1.8;color:#f5eee8;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.actions button{min-width:0}
.contact-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.contact-actions a{font:inherit;text-decoration:none;text-align:center;border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:12px;padding:10px 5px;font-size:12px}
.contact-actions a:hover{background:#ffffff12}
.note{font-size:11px;color:#9e938a;margin-top:16px;line-height:1.7}
.mic{display:none}.mic.active{display:block}
@media(max-width:820px){.shell{grid-template-columns:1fr;padding:10px}.host-card{min-height:58vh}.host-card #avatar,.fallback{min-height:58vh}.chat{align-self:auto}.questions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<section class="host-card">
<div id="badge" class="badge"></div>
<div id="avatar"></div>
<iframe id="fallback" class="fallback" title="3D Host fallback" allow="autoplay"></iframe>
<div id="status" class="status">جاري تجهيز المضيف ثلاثي الأبعاد…</div>
</section>
<section class="chat">
<div id="eyebrow" class="eyebrow"></div>
<h1 id="title"></h1>
<p id="subtitle"></p>
<div id="questions" class="questions"></div>
<div id="answer" class="answer">اختر سؤالاً لأجيبك.</div>
<div class="actions">
<button id="speak" class="primary">استمع للإجابة</button>
<button id="stop">إيقاف الصوت</button>
</div>
<div class="contact-actions">
<a id="wa" target="_blank" rel="noopener">WhatsApp</a>
<a id="call">اتصال</a>
<a id="email">البريد</a>
<a id="maps" target="_blank" rel="noopener">الاتجاهات</a>
</div>
<div id="mic" class="mic">
<button id="listen">🎙️ اسألني بصوتك</button>
</div>
<div class="note">Standard Host قابل لإعادة الاستخدام: لتجهيز عميل جديد، غيّر <b>config.js</b> فقط. المعرفة غير المثبتة لا يتم اختلاقها.</div>
</section>
</div>
<script type="module">
import { TalkingHead } from "talkinghead";

const C=window.HOST_CONFIG;
const $=id=>document.getElementById(id);
document.documentElement.style.setProperty("--accent",C.appearance?.accent||"#e8c99f");
document.documentElement.style.setProperty("--bg",C.appearance?.background||"#100c0a");
document.title=C.brand.name+" — Host Standard";
$("badge").textContent=C.brand.badge;
$("eyebrow").textContent=C.brand.eyebrow;
$("title").textContent=C.brand.title;
$("subtitle").textContent=C.brand.subtitle;

const answer=$("answer"), status=$("status");
let last="";
const questionMap=new Map(C.questions.map(q=>[q.id,q]));

C.questions.forEach(q=>{
  const b=document.createElement("button");
  b.textContent=q.label;
  b.onclick=()=>showAnswer(q);
  $("questions").appendChild(b);
});

function showAnswer(q){
  last=q.answer;
  answer.textContent=last;
  speakFallback(last);
}

function speakFallback(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=C.language.speech||"ar-DZ";
  u.rate=C.language.rate??.88;
  u.pitch=C.language.pitch??1;
  speechSynthesis.speak(u);
}

$("speak").onclick=()=>last&&speakFallback(last);
$("stop").onclick=()=>speechSynthesis?.cancel();

$("wa").href="https://wa.me/"+C.contact.whatsapp;
$("call").href="tel:"+C.contact.phone;
$("email").href="mailto:"+C.contact.email;
$("maps").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.contact.address);

async function startHost(){
  try{
    const head=new TalkingHead($("avatar"),{
      lipsyncModules:["en","de","fr","fi","lt","pt"],
      mixerGainSpeech:3
    });
    await head.showAvatar({
      url:C.host.modelUrl,
      body:C.host.body||"M",
      avatarMood:C.host.mood||"neutral",
      avatarSpeakingHeadMove:.45,
      avatarListeningEyeContact:.65,
      avatarSpeakingEyeContact:.7
    });
    try{head.setView(C.host.view||"upper",{cameraDistance:C.host.cameraDistance||1.15,cameraY:C.host.cameraY||0.02,cameraRotateX:C.host.cameraRotateX||-0.02});}catch{}
    try{head.setLighting({lightAmbientIntensity:.72,lightDirectIntensity:1.15,lightDirectPhi:1.0,lightDirectTheta:.7,lightSpotIntensity:.35,lightSpotPhi:1.15,lightSpotTheta:.55});}catch{}
    window.PASTEL_HEAD=head;
    status.textContent="المضيف جاهز.";
    status.classList.add("ok");
  }catch(err){
    console.error("TalkingHead failed",err);
    status.textContent="تعذر تشغيل محرك المضيف؛ يتم إبقاء مسار الحوار متاحاً.";
    status.classList.add("error");
    $("avatar").style.display="none";
    // Keep the UI functional even if a CDN/model is unavailable.
  }
}
startHost();

// Browser speech recognition is optional and never required for the core flow.
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  $("mic").classList.add("active");
  const rec=new SR();
  rec.lang=C.language.speech||"ar-DZ";
  rec.interimResults=false;
  rec.maxAlternatives=1;
  $("listen").onclick=()=>{
    rec.start();
    $("listen").textContent="🎙️ أستمع…";
  };
  rec.onresult=e=>{
    const text=e.results[0][0].transcript.toLowerCase();
    const hit=C.questions.find(q=>text.includes(q.label.toLowerCase()));
    if(hit) showAnswer(hit);
    else answer.textContent="لم أجد سؤالاً مطابقاً للمعلومات المثبتة. اختر أحد الأسئلة المتاحة.";
  };
  rec.onend=()=>{$("listen").textContent="🎙️ اسألني بصوتك";};
}
</script>
</body>
</html>
