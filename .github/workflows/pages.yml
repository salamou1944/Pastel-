name: Deploy Pastel to GitHub Pages
# Production trigger: keep Pages deployment tied to main changes. TTS v2 smoke uses live Supabase Edge Function.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Re-run production validation after Staff Queue policy changes.
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch photorealistic Host candidate
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o assets/pastel-host.glb \
            https://raw.githubusercontent.com/nirholas/three.ws/238ef6089554773f3485e13b8e463670ab5988d8/public/avatars/realistic-male.glb
          test -s assets/pastel-host.glb
          file assets/pastel-host.glb
      - name: Validate Host module syntax
        run: |
          python - <<'PY'
          import re
          h=open("index.html",encoding="utf-8").read()
          m=re.search(r'<script type="module">(.*?)</script>',h,re.S)
          if not m: raise SystemExit("Host module script missing")
          open("/tmp/pastel-host-module.mjs","w",encoding="utf-8").write(m.group(1))
          PY
          node --check /tmp/pastel-host-module.mjs
      - name: Validate Staff Queue module syntax
        run: |
          python - <<'PY'
          import re
          h=open("staff.html",encoding="utf-8").read()
          m=re.search(r'<script type="module">(.*?)</script>',h,re.S)
          if not m: raise SystemExit("Staff Queue module script missing")
          open("/tmp/pastel-staff.mjs","w",encoding="utf-8").write(m.group(1))
          PY
          node --check /tmp/pastel-staff.mjs
          grep -F 'supabase.channel("pastel-staff-orders",{config:{private:true}})' staff.html >/dev/null
          echo "STAFF_REALTIME_PRIVATE_CHANNEL_OK"
      - name: Verify Host GLB structure
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('assets/pastel-host.glb');if(b.readUInt32LE(0)!==0x46546c67)throw Error('invalid GLB');const j=JSON.parse(b.subarray(20,20+b.readUInt32LE(12)).toString().trim());const nodes=(j.nodes||[]).map(x=>x.name||'');const skins=j.skins||[];const anim=(j.animations||[]).map(x=>x.name||'');const head=nodes.find(n=>/head/i.test(n)&&!/head(?:top|end|tip)$/i.test(n));if(!skins.length||!head)throw Error('missing skeleton/head');console.log(JSON.stringify({skins:skins.length,bones:skins.reduce((n,s)=>n+(s.joints||[]).length,0),headBone:head,animations:anim},null,2));"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify anonymous order read is blocked
        run: |
          code=$(curl -sS -o /tmp/pastel-anon-orders.txt -w "%{http_code}" "https://rdcodzowehzmwdxhztxe.supabase.co/rest/v1/pastel_orders?select=order_id,status&limit=1")
          test "$code" != "200"
          echo "ANON_ORDER_READ_BLOCKED $code"

      - name: Verify deployed Host runtime + Arabic speech with Playwright
        env:
          PASTEL_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > pastel-host-smoke.mjs <<'EOF'
          import { chromium } from "playwright";
          const url = process.env.PASTEL_PAGE_URL;
          if (!url) throw new Error("missing page_url");
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const pageErrors = [];
          page.on("pageerror", err => pageErrors.push(String(err?.message || err)));
          page.on("console", msg => { if (msg.type() === "error") pageErrors.push(msg.text()); });
          await page.goto(url, {waitUntil:"networkidle", timeout:60000});
          await page.waitForTimeout(5000);

          const runtime = await page.evaluate(() => {
            const el=document.querySelector("#pastel-agent");
            const shadow=el?.shadowRoot;
            const canvas=shadow?.querySelector("canvas");
            const rect=el?.getBoundingClientRect();
            const verify=window.__PASTEL_HOST_VERIFY__||null;
            return {
              verify,
              agentPresent:!!el,
              agentReady:!!verify?.agentReady,
              canvas:!!canvas,
              canvasWidth:canvas?.width||0,
              canvasHeight:canvas?.height||0,
              hostWidth:rect?.width||0,
              hostHeight:rect?.height||0,
              speak:window.__PASTEL_SPEAK_DIAG__||null
            };
          });

          if(!runtime.agentPresent) throw new Error("PASTEL agent element missing");
          if(!runtime.agentReady) throw new Error("PASTEL agent runtime never became ready: "+JSON.stringify(runtime.verify)+"; pageErrors="+pageErrors.join(" | "));
          if(!runtime.canvas || runtime.canvasWidth<100 || runtime.canvasHeight<100) throw new Error("PASTEL agent canvas not rendered: "+JSON.stringify(runtime));
          if(runtime.hostHeight<300) throw new Error("PASTEL Host stage is too short for full-body presentation: "+JSON.stringify(runtime));

          const speech = await page.evaluate(() => {
            const text="اختبار صوت المضيف في PASTEL.";
            window.__PASTEL_SPEAK__?.(text);
            return window.__PASTEL_SPEAK_DIAG__||null;
          });
          await page.waitForTimeout(800);
          const speechAfter = await page.evaluate(() => window.__PASTEL_SPEAK_DIAG__||null);
          if(!(speechAfter?.calls>0)) throw new Error("Host speech was not invoked: "+JSON.stringify(speechAfter));
          if(!speechAfter?.voice && !speechAfter?.lang) throw new Error("Arabic voice diagnostics missing: "+JSON.stringify(speechAfter));

          // Real customer journey smoke: exercise the production Order UI and backend.
          const orderButton = page.locator('.floating-actions button[data-action="order"]').first();
          if (await orderButton.count()) await orderButton.click();
          else await page.locator('button[data-action="order"]').first().click();
          await page.locator("#order-item-name").fill("PASTEL SMOKE TEST");
          await page.locator("#order-item-qty").fill("1");
          await page.locator("#add-order-item").click();
          await page.locator("#submit-order").click();
          await page.waitForFunction(() => /تم تأكيد الطلب رقم/i.test(document.querySelector("#order-status")?.textContent || ""), null, {timeout:30000});
          const orderStatus = await page.locator("#order-status").textContent();
          const orderIdMatch = String(orderStatus||"").match(/([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})/i);
          if (!orderIdMatch) throw new Error("Production order returned no valid Order ID: "+orderStatus);
          console.log("REAL_ORDER_SMOKE_OK "+orderIdMatch[1]);

          console.log(JSON.stringify({
            url,
            agentPresent:runtime.agentPresent,
            agentReady:runtime.agentReady,
            canvas:{width:runtime.canvasWidth,height:runtime.canvasHeight},
            host:{width:runtime.hostWidth,height:runtime.hostHeight},
            speech,
            speechAfter,
            verify:runtime.verify
          }, null, 2));
          await browser.close();
          EOF
          node pastel-host-smoke.mjs