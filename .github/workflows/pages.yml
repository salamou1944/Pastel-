name: Deploy Pastel to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch CC0 3D host asset
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o assets/mpfb.glb \
            https://raw.githubusercontent.com/met4citizen/TalkingHead/main/avatars/brunette.glb
          test -s assets/mpfb.glb
          file assets/mpfb.glb
      - name: Optimize 3D host for mobile web
        run: |
          npx --yes @gltf-transform/cli optimize assets/mpfb.glb assets/mpfb-optimized.glb --texture-compress webp
          test -s assets/mpfb-optimized.glb
          mv assets/mpfb-optimized.glb assets/mpfb.glb
          file assets/mpfb.glb
          ls -lh assets/mpfb.glb
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
