name: Deploy Pastel to GitHub Pages
# Production trigger: keep Pages deployment tied to main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch photorealistic Host candidate
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o assets/pastel-host.glb \
            https://raw.githubusercontent.com/nirholas/three.ws/238ef6089554773f3485e13b8e463670ab5988d8/public/avatars/realistic-male.glb
          test -s assets/pastel-host.glb
          file assets/pastel-host.glb
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
