name: Deploy Pastel to GitHub Pages
# Production trigger: keep Pages deployment tied to main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch photorealistic Host candidate
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o assets/pastel-host.glb \
            https://raw.githubusercontent.com/nirholas/three.ws/238ef6089554773f3485e13b8e463670ab5988d8/public/avatars/realistic-male.glb
          test -s assets/pastel-host.glb
          file assets/pastel-host.glb
      - name: Verify Host GLB structure
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('assets/pastel-host.glb');if(b.readUInt32LE(0)!==0x46546c67)throw Error('invalid GLB');const j=JSON.parse(b.subarray(20,20+b.readUInt32LE(12)).toString().trim());const nodes=(j.nodes||[]).map(x=>x.name||'');const skins=j.skins||[];const anim=(j.animations||[]).map(x=>x.name||'');const head=nodes.find(n=>/head/i.test(n)&&!/head(?:top|end|tip)$/i.test(n));if(!skins.length||!head)throw Error('missing skeleton/head');console.log(JSON.stringify({skins:skins.length,bones:skins.reduce((n,s)=>n+(s.joints||[]).length,0),headBone:head,animations:anim},null,2));"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Host audio + lipsync with Playwright
        env:
          PASTEL_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > /tmp/pastel-host-smoke.mjs <<'EOF'
          import { chromium } from "playwright";
          const url = process.env.PASTEL_PAGE_URL;
          if (!url) throw new Error("missing page_url");
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const tts = [];
          page.on("console", msg => {
            if (msg.text().includes("[PASTEL TTS]")) console.log(msg.text());
          });
          page.on("request", req => {
            if (req.url().includes("/functions/v1/pastel-tts-v2")) tts.push(req);
          });
          await page.goto(url, {waitUntil:"networkidle", timeout:60000});
          await page.waitForFunction(() => window.__PASTEL_HOST_VERIFY__?.headBone, null, {timeout:30000});
          const verify = await page.evaluate(() => window.__PASTEL_HOST_VERIFY__);
          if (!verify.audioLipsync?.analyser) throw new Error("audio analyser not ready");
          if (!verify.headBone) throw new Error("head bone missing");
          if (!verify.skeleton) throw new Error("skeleton missing");
          const buttons = await page.locator("#questions button").count();
          if (!buttons) throw new Error("question buttons missing");
          await page.locator("#questions button").first().click();
          await page.waitForTimeout(2500);
          if (!tts.length) throw new Error("TTS endpoint was not requested");
          const samples = await page.evaluate(() => window.__PASTEL_HOST_LIPSYNC_SAMPLES__ || []);
          const nonzero = samples.some(s => (s.values?.length||0) + (s.jaw?.length||0) > 0);
          if (!nonzero) throw new Error("no observed non-zero lip/jaw morph during speech");
          console.log(JSON.stringify({url,verify,ttsRequests:tts.length,samples: samples.length,nonzero},null,2));
          await browser.close();
          EOF
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sed -i 's/window.__PASTEL_HOST_LIPSYNC_SAMPLES__/window.__PASTEL_HOST_LIPSYNC_SAMPLES__/' /tmp/pastel-host-smoke.mjs
          # Collect live morph samples while the real TTS audio is playing.
          python3 - <<'PY'
          p='/tmp/pastel-host-smoke.mjs'
          s=open(p).read()
          s=s.replace('await page.waitForTimeout(2500);','await page.waitForTimeout(250);\n          await page.evaluate(() => { window.__PASTEL_HOST_LIPSYNC_SAMPLES__=[]; const t=setInterval(() => { const x=window.__PASTEL_HOST_LIPSYNC_SAMPLE__?.(); if(x) window.__PASTEL_HOST_LIPSYNC_SAMPLES__.push(x); },80); setTimeout(() => clearInterval(t),2200); });\n          await page.waitForTimeout(2200);')
          open(p,'w').write(s)
          PY
          node /tmp/pastel-host-smoke.mjs
