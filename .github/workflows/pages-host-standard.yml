name: Validate Host Standard

on:
  push:
    branches: [main]
    paths:
      - "host-standard/**"
      - ".github/workflows/pages-host-standard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-standard-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Host Standard config
        run: node --check host-standard/config.js

      - name: Validate Host Standard manifest files
        run: |
          test -f host-standard/index.html
          test -f host-standard/config.schema.json
          test -f host-standard/order-schema.json
          test -f host-standard/ORDER-FLOW.md
          echo "Host Standard files present and config syntax is valid."
