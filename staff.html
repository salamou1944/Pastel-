<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASTEL · Staff Queue · Realtime</title>
<style>
:root{--bg:#090706;--panel:#17110e;--line:#ffffff18;--text:#f8f2eb;--muted:#b8aaa0;--accent:#e8c99f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#6b493522,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(1200px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.12em;font-weight:800}.muted{color:var(--muted)}h1{margin:8px 0;font-size:clamp(30px,5vw,52px)}button{font:inherit;border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}button.primary{background:var(--accent);color:#1a120d;border:0;font-weight:800}.auth,.toolbar,.card{border:1px solid var(--line);background:#17110ecc;border-radius:20px;padding:18px}.auth{max-width:560px;margin:70px auto}.auth form{display:grid;gap:10px;margin-top:16px}input,select{width:100%;border:1px solid var(--line);background:#080706;color:var(--text);border-radius:12px;padding:12px;font:inherit}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:22px 0}.queue{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.card{display:grid;gap:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#ffffff0c;font-size:11px}.status.NEW{background:#e8c99f33}.status.ACCEPTED{background:#8cb7d433}.status.PREPARING{background:#d6a25a33}.status.READY{background:#8fbf8f33}.status.COMPLETED{background:#ffffff12}.status.CANCELLED{background:#8c5b5b33}.items{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:10px}.item{display:flex;justify-content:space-between;gap:10px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.empty{text-align:center;padding:50px;color:var(--muted);border:1px dashed var(--line);border-radius:20px}.error{color:#ffb0a8}.ok{color:#bde4bd}.small{font-size:12px}
@media(max-width:560px){main{padding:12px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section id="login" class="auth">
<div class="eyebrow">PASTEL OPERATIONS</div>
<h1>طابور الطلبات</h1>
<p class="muted">دخول الموظف يتم عبر رابط سحري إلى البريد المعتمد فقط. لا يتم عرض الطلبات قبل المصادقة.</p>
<form id="login-form">
<input id="email" type="email" value="sarl.pastel.pastry@gmail.com" autocomplete="email" required>
<button class="primary" type="submit">إرسال رابط الدخول</button>
<div id="auth-status" class="small"></div>
</form>
</section>
<section id="app" hidden>
<div class="top">
<div><div class="eyebrow">PASTEL OPERATIONS</div><h1>طابور الطلبات</h1><div id="identity" class="muted small"></div><div id="realtime-status" class="small muted">○ غير متصل</div></div>
<button id="logout">تسجيل الخروج</button>
</div>
<div class="toolbar">
<div><strong id="count">0</strong> طلبات</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<select id="filter"><option value="ACTIVE">النشطة</option><option value="ALL">كل الطلبات</option><option value="NEW">جديدة</option><option value="ACCEPTED">مقبولة</option><option value="PREPARING">قيد التحضير</option><option value="READY">جاهزة</option><option value="COMPLETED">مكتملة</option><option value="CANCELLED">ملغاة</option></select>
<button id="refresh">تحديث</button>
</div>
</div>
<div id="message" class="small"></div>
<div id="queue" class="queue"></div>
</section>
</main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm";
const SUPABASE_URL="https://rdcodzowehzmwdxhztxe.supabase.co";
const SUPABASE_KEY="sb_publishable_0BVCTENaMqOgVf8lL6zz3Q_2ypzyiJK";
const STAFF_EMAIL="sarl.pastel.pastry@gmail.com";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const login=document.getElementById("login"),app=document.getElementById("app"),queue=document.getElementById("queue"),message=document.getElementById("message");
const labels={NEW:"جديد",ACCEPTED:"مقبول",PREPARING:"قيد التحضير",READY:"جاهز",COMPLETED:"مكتمل",CANCELLED:"ملغى"};
const next={NEW:"ACCEPTED",ACCEPTED:"PREPARING",PREPARING:"READY",READY:"COMPLETED"};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function showMessage(text,kind=""){message.className="small "+kind;message.textContent=text}
function render(rows){
 const filter=document.getElementById("filter").value;
 const visible=rows.filter(r=>filter==="ALL"||filter===r.status||(filter==="ACTIVE"&&!["COMPLETED","CANCELLED"].includes(r.status)));
 document.getElementById("count").textContent=visible.length;
 if(!visible.length){queue.innerHTML='<div class="empty">لا توجد طلبات في هذا العرض.</div>';return}
 queue.innerHTML=visible.map(r=>{
   const items=Array.isArray(r.items)?r.items:[];
   const action=next[r.status];
   return '<article class="card"><div class="head"><div><strong>#'+esc(String(r.order_id).slice(0,8))+'</strong><div class="muted small">'+new Date(r.created_at).toLocaleString("ar-DZ")+'</div></div><span class="status '+esc(r.status)+'">'+esc(labels[r.status]||r.status)+'</span></div><div class="items">'+items.map(i=>'<div class="item"><span>'+esc(i.name)+(i.notes?' · '+esc(i.notes):"")+'</span><strong>×'+esc(i.quantity)+'</strong></div>').join("")+'</div><div class="actions">'+(action?'<button class="primary" data-id="'+esc(r.order_id)+'" data-status="'+action+'">'+esc(labels[action])+'</button>':'<span class="muted small">لا توجد خطوة تالية</span>')+(r.status!=="CANCELLED"&&r.status!=="COMPLETED"?'<button data-id="'+esc(r.order_id)+'" data-status="CANCELLED">إلغاء</button>':"")+'</div></article>'
 }).join("");
 queue.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));
}
let rows=[];
let realtimeChannel=null;
let realtimeState="offline";
function setRealtimeState(state){
  realtimeState=state;
  const el=document.getElementById("realtime-status");
  if(el) el.textContent=state==="live"?"● مباشر":"○ غير متصل";
  if(el) el.className="small "+(state==="live"?"ok":"muted");
}
function upsertRealtimeRow(row){
  if(!row?.order_id)return;
  const i=rows.findIndex(x=>x.order_id===row.order_id);
  if(i>=0) rows[i]={...rows[i],...row}; else rows=[row,...rows];
  render(rows);
}
function removeRealtimeRow(id){
  rows=rows.filter(x=>x.order_id!==id);
  render(rows);
}
function startRealtime(){
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel("pastel-staff-orders",{config:{private:true}})
    .on("system","*",payload=>{
      if(payload?.extension==="postgres_changes" && payload?.status==="ok") setRealtimeState("live");
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"pastel_orders"},payload=>{
      upsertRealtimeRow(payload.new);
      showMessage("طلب جديد وصل مباشرة.","ok");
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"pastel_orders"},payload=>{
      upsertRealtimeRow(payload.new);
      showMessage("تم تحديث طلب مباشرة.","ok");
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"pastel_orders"},payload=>{
      removeRealtimeRow(payload.old?.order_id);
    })
    .subscribe(async(status,err)=>{
      if(status==="SUBSCRIBED"){
        setRealtimeState("live");
        await load();
      } else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(status)){
        setRealtimeState("offline");
        if(err) console.warn("[PASTEL REALTIME]",status,err);
      }
    });
}
async function load(){
 showMessage("جاري تحميل الطلبات…");
 const {data,error}=await supabase.from("pastel_orders").select("order_id,status,items,created_at,updated_at").order("created_at",{ascending:false}).limit(100);
 if(error){showMessage("تعذر تحميل الطابور: "+error.message,"error");return}
 rows=data||[];showMessage("متصل · آخر تحديث "+new Date().toLocaleTimeString("ar-DZ"),"ok");render(rows);
}
async function updateStatus(id,status){
 showMessage("جاري تحديث الطلب…");
 const {error}=await supabase.from("pastel_orders").update({status}).eq("order_id",id);
 if(error){showMessage("فشل تحديث الحالة: "+error.message,"error");return}
 await load();
}
document.getElementById("filter").onchange=()=>render(rows);
document.getElementById("refresh").onclick=load;
document.getElementById("logout").onclick=async()=>{ if(realtimeChannel) await supabase.removeChannel(realtimeChannel); realtimeChannel=null; await supabase.auth.signOut(); };
async function syncRealtimeAuth(session){ if(session?.access_token) await supabase.realtime.setAuth(session.access_token); }\ndocument.getElementById("login-form").onsubmit=async e=>{
 e.preventDefault();
 const email=document.getElementById("email").value.trim().toLowerCase();
 const status=document.getElementById("auth-status");
 if(email!==STAFF_EMAIL){status.textContent="هذا البريد غير مخول.";return}
 status.textContent="جاري إرسال رابط الدخول…";
 const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.href}});
 status.textContent=error?"تعذر إرسال الرابط: "+error.message:"تم إرسال رابط الدخول. افحص البريد.";
};
supabase.auth.onAuthStateChange(async (_event,session)=>{
 if(!session){login.hidden=false;app.hidden=true;return}
 if((session.user.email||"").toLowerCase()!==STAFF_EMAIL){await supabase.auth.signOut();showMessage("هذا الحساب غير مخول.","error");return}
 login.hidden=true;app.hidden=false;document.getElementById("identity").textContent="دخول الموظف: "+session.user.email;
 await load();
 if(!realtimeChannel) startRealtime();
});
const {data:{session}}=await supabase.auth.getSession();
if(session){ await syncRealtimeAuth(session); await load(); startRealtime(); }
</script>
</body>
</html>
