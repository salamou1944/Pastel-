<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASTEL Host Premium 3D</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#080706;color:#fff}*{box-sizing:border-box}.app{height:100%;display:grid;grid-template-columns:1.35fr .8fr}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#493528,#100c09 60%,#050403)}#avatar{position:absolute;inset:0}#humanHost{width:100%;height:100%;display:block;background:transparent}.copy{position:absolute;z-index:3;bottom:24px;right:24px;left:24px}.copy h1{font-size:clamp(34px,5vw,64px);margin:6px 0}.copy p{color:#d7c8b6}.status{display:inline-block;padding:8px 12px;border:1px solid #e8c99f44;border-radius:99px;background:#0008;font-size:11px}.panel{padding:30px;background:#15100c;display:flex;align-items:center;overflow:auto}.inner{width:100%;max-width:570px;margin:auto}.ey{font-size:11px;letter-spacing:.15em;color:#e8c99f}.h{font-size:32px;margin:10px 0}.intro{color:#cdbfae;line-height:1.8}.questions,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q,.action,.send{padding:14px;border-radius:15px;border:1px solid #e8c99f33;background:#0c0907;color:#fff;cursor:pointer;text-decoration:none;text-align:center}.q:hover,.action:hover,.send:hover{border-color:#e8c99f99}.answer{min-height:100px;margin:15px 0;padding:16px;border:1px solid #e8c99f33;border-radius:16px;background:#090705;line-height:1.9}.chat{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.chat input{min-width:0;padding:14px;border-radius:15px;border:1px solid #e8c99f33;background:#090705;color:#fff;outline:none}.note{font-size:11px;color:#887c70;line-height:1.6;margin-top:15px}@media(max-width:850px){.app{display:block}.stage{height:58vh;min-height:430px}.panel{min-height:42vh;padding:20px}}@media(max-width:500px){.questions{grid-template-columns:1fr}.h{font-size:26px}}</style><script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
"talkinghead":"https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
}}
</script>
<script type="module">
import { TalkingHead } from "talkinghead";

const K=[
["الخدمات","PASTEL يقدم الفطور والغداء والعشاء والبرانش والمشروبات."],
["الحلويات","لدينا pâtisseries وviennoiseries وmillefeuille وalmond croissant وpistachio trompe-l’œil وblondie وmacarons والتارت والكيك."],
["المشروبات","لدينا القهوة والشاي والـsmoothies والمشروبات المميزة."],
["الموقع","العنوان هو Résidence El Chourouk، Akid Lotfi، Oran 31000، Algeria. والـPlus Code هو PCF8+P4V."],
["التواصل","يمكنك التواصل مع PASTEL عبر WhatsApp أو الهاتف أو البريد الإلكتروني."],
["الأسعار","الأسعار الكاملة غير مثبتة في قاعدة المعرفة الحالية، لذلك لن أخمّنها."]
];
const q=document.getElementById("questions"),a=document.getElementById("answer"),s=document.getElementById("status"),input=document.getElementById("input"),send=document.getElementById("send"),avatar=document.getElementById("avatar");
let head=null, voice=null, speaking=false, mouthTimer=null, gestureTimer=null;

function chooseArabicVoice(){
 const voices=speechSynthesis.getVoices();
 voice=voices.find(v=>/^ar-DZ/i.test(v.lang))||voices.find(v=>/^ar/i.test(v.lang))||voices.find(v=>/Arabic/i.test(v.name))||null;
}
chooseArabicVoice(); speechSynthesis.onvoiceschanged=chooseArabicVoice;

function animateSpeech(on, intensity=1){
 speaking=on;
 if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null}
 if(!on){ try{head?.setFixedValue("jawOpen",0,180)}catch(e){} return; }
 let phase=0;
 mouthTimer=setInterval(()=>{
   if(!speaking){clearInterval(mouthTimer);mouthTimer=null;return}
   phase+=0.62;
   const envelope=Math.min(1,Math.max(.35,intensity));
   const jaw=Math.max(0,Math.min(.72,(0.10+Math.abs(Math.sin(phase))*0.20+Math.abs(Math.sin(phase*1.83))*0.13)*envelope));
   try{head?.setFixedValue("jawOpen",jaw,70)}catch(e){}
 },70);
}

function speak(text){
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=voice?.lang||"ar-DZ"; u.voice=voice||null;
 u.rate=1.28; u.pitch=1; u.volume=1;
 u.onstart=()=>animateSpeech(true,.9);
 u.onboundary=(e)=>{
   const ch=String(text).slice(e.charIndex||0,(e.charIndex||0)+12);
   const vowels=(ch.match(/[اويىأةإؤ]/g)||[]).length;
   animateSpeech(true,.55+Math.min(.65,vowels*.12));
   head?.makeEyeContact(650);
 };
 u.onpause=()=>animateSpeech(false);
 u.onresume=()=>animateSpeech(true,.9);
 u.onend=()=>animateSpeech(false); u.onerror=()=>animateSpeech(false);
 speechSynthesis.speak(u);
}

function respond(text){
 a.textContent=text;
 head?.lookAtCamera(700);
 head?.setMood("happy");
 if(gestureTimer)clearTimeout(gestureTimer);
 
 speak(text);
}

K.forEach(([label,text])=>{
 const b=document.createElement("button"); b.className="q"; b.textContent=label;
 b.onclick=()=>respond(text); q.appendChild(b);
});

function answerQuestion(raw){
 const t=raw.trim().toLowerCase(); if(!t)return;
 const hit=t.includes("سعر")||t.includes("اسعار")||t.includes("الأسعار")?K[5]:
 t.includes("موقع")||t.includes("عنوان")||t.includes("وين")||t.includes("أين")?K[3]:
 t.includes("تواصل")||t.includes("واتساب")||t.includes("هاتف")||t.includes("رقم")||t.includes("بريد")?K[4]:
 t.includes("مشروب")||t.includes("قهوة")||t.includes("شاي")||t.includes("سموث")?K[2]:
 t.includes("حلويات")||t.includes("حلو")||t.includes("كيك")||t.includes("كرواسون")||t.includes("مكارون")?K[1]:
 t.includes("فطور")||t.includes("غداء")||t.includes("عشاء")||t.includes("برانش")||t.includes("خدمات")?K[0]:null;
 respond(hit?hit[1]:"يمكنني مساعدتك بالمعلومات المثبتة عن خدمات PASTEL وحلوياته ومشروباته وموقعه وطرق التواصل. إذا كنت تسأل عن الأسعار، فهي غير مثبتة حالياً ولن أخمّنها.");
}
send.onclick=()=>answerQuestion(input.value);
input.addEventListener("keydown",e=>{if(e.key==="Enter")answerQuestion(input.value)});

async function boot(){
 try{
  head=new TalkingHead(avatar,{
   cameraView:"mid",
   cameraRotateEnable:false,
   cameraPanEnable:false,
   cameraZoomEnable:false,
   modelFPS:30,
   modelMovementFactor:1,
   avatarIdleEyeContact:0.75,
   avatarIdleHeadMove:0.9,
   avatarSpeakingEyeContact:0.9,
   avatarSpeakingHeadMove:1,
   avatarMood:"happy"
  });
  await head.showAvatar({
   url:"../assets/brunette.glb",
   body:"F",
   avatarMood:"happy",
   avatarIdleEyeContact:0.75,
   avatarIdleHeadMove:0.9,
   avatarSpeakingEyeContact:0.9,
   avatarSpeakingHeadMove:1
  });
  head.lookAtCamera(1200);
  s.textContent="3D Host متصل";
 }catch(error){
  console.error(error);
  s.textContent="تعذر تشغيل المضيف ثلاثي الأبعاد";
 }
}
boot();
</script></body></html>
