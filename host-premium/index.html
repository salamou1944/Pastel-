odule" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script></head><body><main class="app"><section class="stage"><div id="avatar"><model-viewer id="humanHost" src="../assets/mpfb.glb" camera-controls disable-pan interaction-prompt="none" autoplay shadow-intensity="1.2" exposure="1.1" camera-target="0m 1.2m 0m" camera-orbit="0deg 80deg auto" field-of-view="28deg" alt="PASTEL 3D Host"></model-viewer></div><div class="copy"><span id="status" class="status">تشغيل المضيف…</span><h1>أهلاً بك.</h1><p>مضيف PASTEL ثلاثي الأبعاد</p></div></section><section class="panel"><div class="inner"><div class="ey">PASTEL PASTRY&COFFEE</div><h2 class="h">أنا مضيفك الافتراضي</h2><p class="intro">اسألني عن الخدمات، الحلويات، المشروبات، الموقع والتواصل.</p><div id="questions" class="questions"></div><div class="chat"><input id="input" aria-label="سؤال" placeholder="اكتب سؤالك عن PASTEL…"><button id="send" class="send">إرسال</button></div><div id="answer" class="answer">أنا جاهز لاستقبالك.</div><div class="actions"><a class="action" href="https://wa.me/213541332877" target="_blank" rel="noopener">WhatsApp</a><a class="action" href="tel:+213541332877">اتصال</a><a class="action" href="mailto:sarl.pastel.pastry@gmail.com">البريد</a><a class="action" href="https://www.google.com/maps/search/?api=1&query=Résidence%20El%20Chourouk%2C%20Akid%20Lotfi%2C%20Oran" target="_blank" rel="noopener">الاتجاهات</a></div><div class="note">المضيف لا يخترع الأسعار أو المعلومات غير المثبتة.</div></div></section></main><script src="./config.js"></script><script type="module">
