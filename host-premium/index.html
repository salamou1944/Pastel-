ead":"https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"}}</script></head><body><main class="app"><section class="host"><div id="avatar"></div><div class="copy"><span class="status" id="status">تشغيل المضيف…</span><h1>أهلاً بك.</h1><p>مضيف PASTEL ثلاثي الأبعاد</p></div></section><section class="panel"><div class="inner"><div class="ey">PASTEL PASTRY&COFFEE</div><h2>أنا مضيفك الافتراضي</h2><p class="intro">اسألني عن الخدمات، الحلويات، المشروبات أو موقع PASTEL.</p><div class="questions"><button class="q" data-a="PASTEL يقدم الفطور والغداء والعشاء والبرانش والمشروبات.">الخدمات</button><button class="q" data-a="لدينا pâtisseries وviennoiseries وmillefeuille وalmond croissant وpistachio trompe-l’œil وblondie وmacarons والتارت والكيك.">الحلويات</button><button class="q" data-a="لدينا القهوة والشاي والـsmoothies والمشروبات المميزة.">المشروبات</button><button class="q" data-a="العنوان هو Résidence El Chourouk، Akid Lotfi، Oran 31000، Algeria.">الموقع</button></div><div class="answer" id="answer">أنا جاهز لاستقبالك.</div><div class="actions"><a class="action" href="https://wa.me/213541332877" target="_blank">WhatsApp</a><a class="action" href="tel:+213541332877">اتصال</a><a class="action" href="mailto:sarl.pastel.pastry@gmail.com">البريد</a><a class="action" href="https://www.google.com/maps/search/?api=1&query=Résidence%20El%20Chourouk%2C%20Akid%20Lotfi%2C%20Oran" target="_blank">الاتجاهات</a></div><div class="note">المعلومات التجارية غير المثبتة لا يتم اختراعها.</div></div></section></main><script type="module">import{TalkingHead}from"talkinghead";const avatar=document.getElementById("avatar"),status=document.getElementById("status"),answer=document.getElementById("answer");const knowledge=[...document.querySelectorAll(".q")];let head;async function boot(){try{head=new TalkingHead(avatar,{lipsyncModules:["en","de","fr","fi","lt"],mixerGainSpeech:3,cameraView:"upper"});await head.showAvatar({url:"../assets/mpfb.glb",body:"M",avatarMood:"neutral
