<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASTEL Host Premium 3D</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#080706;color:#fff}*{box-sizing:border-box}.app{height:100%;display:grid;grid-template-columns:1.35fr .8fr}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#493528,#100c09 60%,#050403)}#avatar{position:absolute;inset:0}#humanHost{width:100%;height:100%;display:block;background:transparent}.copy{position:absolute;z-index:3;bottom:24px;right:24px;left:24px}.copy h1{font-size:clamp(34px,5vw,64px);margin:6px 0}.copy p{color:#d7c8b6}.status{display:inline-block;padding:8px 12px;border:1px solid #e8c99f44;border-radius:99px;background:#0008;font-size:11px}.panel{padding:30px;background:#15100c;display:flex;align-items:center;overflow:auto}.inner{width:100%;max-width:570px;margin:auto}.ey{font-size:11px;letter-spacing:.15em;color:#e8c99f}.h{font-size:32px;margin:10px 0}.intro{color:#cdbfae;line-height:1.8}.questions,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q,.action,.send{padding:14px;border-radius:15px;border:1px solid #e8c99f33;background:#0c0907;color:#fff;cursor:pointer;text-decoration:none;text-align:center}.q:hover,.action:hover,.send:hover{border-color:#e8c99f99}.answer{min-height:100px;margin:15px 0;padding:16px;border:1px solid #e8c99f33;border-radius:16px;background:#090705;line-height:1.9}.chat{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.chat input{min-width:0;padding:14px;border-radius:15px;border:1px solid #e8c99f33;background:#090705;color:#fff;outline:none}.note{font-size:11px;color:#887c70;line-height:1.6;margin-top:15px}@media(max-width:850px){.app{display:block}.stage{height:58vh;min-height:430px}.panel{min-height:42vh;padding:20px}}@media(max-width:500px){.questions{grid-template-columns:1fr}.h{font-size:26px}}</style><script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
"talkinghead":"https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
}}
</script>
<script src="./config.js"></script>
<script>window.addEventListener("error",e=>{const el=document.getElementById("status");if(el)el.textContent="خطأ في تحميل مكونات المضيف";});</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm";

const C=window.PASTEL_PREMIUM||{};
const K=C.knowledge||[];
const q=document.getElementById("questions"),a=document.getElementById("answer"),s=document.getElementById("status"),input=document.getElementById("input"),send=document.getElementById("send"),mount=document.getElementById("avatar");
let model=null,lastText="",speaking=false,raf=0;

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=C.speech?.lang||"ar-DZ"; u.rate=C.speech?.rate||1.18; u.pitch=C.speech?.pitch||1; u.volume=1;
 u.onstart=()=>{speaking=true;s.classList.add("ok")};
 u.onend=()=>{speaking=false};
 u.onerror=()=>{speaking=false};
 speechSynthesis.speak(u);
}

function respond(text){
 lastText=text; a.textContent=text;
 model?.rotation.set(0,.10,0);
 speak(text);
}

function answerQuestion(raw){
 const t=raw.trim().toLowerCase(); if(!t)return;
 const hit=K.find(item=>(item.keys||[]).some(k=>t.includes(String(k).toLowerCase())));
 respond(hit?.answer||"يمكنني مساعدتك بالمعلومات المثبتة عن خدمات PASTEL وحلوياته ومشروباته وموقعه وطرق التواصل. إذا كنت تسأل عن الأسعار، فهي غير مثبتة حالياً ولن أخمّنها.");
}

K.forEach(item=>{const b=document.createElement("button");b.className="q";b.textContent=item.label;b.onclick=()=>respond(item.answer);q.appendChild(b)});
send.onclick=()=>answerQuestion(input.value);
input.addEventListener("keydown",e=>{if(e.key==="Enter")answerQuestion(input.value)});
document.getElementById("speak")?.addEventListener("click",()=>lastText&&speak(lastText));
document.getElementById("stop")?.addEventListener("click",()=>{speechSynthesis?.cancel();speaking=false});

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0,0);
mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffead0,0x24150f,2.2));
const key=new THREE.DirectionalLight(0xffe4c5,3); key.position.set(2,4,4); scene.add(key);
const fill=new THREE.DirectionalLight(0xd9e7ff,1.2); fill.position.set(-3,2,1); scene.add(fill);

function resize(){const w=Math.max(1,mount.clientWidth),h=Math.max(1,mount.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
addEventListener("resize",resize); resize();

new GLTFLoader().load("../assets/brunette.glb",g=>{
 model=g.scene; scene.add(model);
 const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);
 const max=Math.max(size.x,size.y,size.z);
 const dist=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.02;
 camera.position.set(0,size.y*.08,dist); camera.lookAt(0,size.y*.08,0);
 s.textContent="3D Host متصل";
 s.classList.remove("error");
 const clock=new THREE.Clock();
 function animate(){
  raf=requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  model.rotation.y=Math.sin(t*.35)*.035+(speaking?Math.sin(t*3.5)*.018:0);
  model.position.y=Math.sin(t*.9)*.008;
  renderer.render(scene,camera);
 }
 animate();
},xhr=>{
 s.textContent=xhr.total?("جاري تحميل المضيف ثلاثي الأبعاد… "+Math.round(xhr.loaded/xhr.total*100)+"%"):"جاري تحميل المضيف ثلاثي الأبعاد…";
},err=>{
 console.error(err);
 s.textContent="تعذر تحميل نموذج المضيف ثلاثي الأبعاد";
 s.classList.add("error");
});
</script></body></html>
